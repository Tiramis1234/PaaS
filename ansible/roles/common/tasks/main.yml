- name: Set hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ cluster_hostname }}"
    use: systemd

- name: Ensure localhost entry exists in /etc/hosts
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s'
    line: "127.0.0.1 localhost"
    state: present

- name: Map new hostname in /etc/hosts
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ cluster_hostname }}"
    insertafter: '^127\.0\.0\.1\s'
    state: present

- name: Set timezone to Warsaw
  become: true
  community.general.timezone:
      name: Europe/Warsaw

- name: Make sure chrony is installed
  become: true
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Make sure chrony is enabled
  become: true
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true

- name: Import updates tasks
  ansible.builtin.import_tasks:
    file: updates.yml
